# Redirect all non-canonical domains → canonical thetraderai.net
server {
    listen 80;
    server_name www.thetraderai.net traderai.com www.traderai.com;

    # 301 redirect to canonical domain (preserve path and query string)
    return 301 https://thetraderai.net$request_uri;
}

# Canonical server — thetraderai.net
server {
    listen 80;
    server_name thetraderai.net;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Redirect /index.html → / (canonical homepage)
    location = /index.html {
        return 301 /;
    }

    # Redirect .html URLs to clean trailing-slash URLs (canonical)
    rewrite ^/(.*)\.html$ /$1/ permanent;

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA-style routing — serve index.html for all routes
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
